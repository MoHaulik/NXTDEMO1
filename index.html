<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NXT/ExpoXR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js" } }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
:root{
  --navy:#1C2951; --bg:#F7F9FC; --dim:#5A6478; --line:#E3E8F1;
  --a1:#3E6DF3; --a2:#5AA5F7;
  --grad:linear-gradient(95deg,var(--a1),var(--a2));
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;overflow:hidden;background:var(--bg);color:var(--navy)}
body.xr-active{background:transparent}

/* ---------- Landing ---------- */
.landing{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% -10%,#FFFFFF 0%,var(--bg) 60%)}
.floor{position:absolute;left:-25%;right:-25%;bottom:-12%;height:52%;pointer-events:none;
  background:linear-gradient(rgba(28,41,81,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(28,41,81,.07) 1px,transparent 1px);
  background-size:64px 64px;transform:perspective(700px) rotateX(64deg);transform-origin:50% 0;
  -webkit-mask-image:linear-gradient(#000 10%,transparent 85%);mask-image:linear-gradient(#000 10%,transparent 85%)}
.glow{position:absolute;left:50%;bottom:8%;width:640px;height:280px;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(50% 60% at 50% 100%,rgba(62,109,243,.14),transparent 70%)}
.hero{position:relative;text-align:center;max-width:640px;padding:0 28px}
.brand{font-weight:800;font-size:clamp(2.6rem,7vw,4.6rem);letter-spacing:-.035em;line-height:1.05;color:var(--navy)}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--dim);font-size:1.08rem;line-height:1.65;max-width:460px;margin:20px auto 36px}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:1rem;letter-spacing:.01em;cursor:pointer;border-radius:999px;padding:17px 40px;transition:transform .25s,box-shadow .25s,border-color .25s}
.btn.primary{border:none;color:#fff;background:var(--grad);box-shadow:0 10px 30px rgba(62,109,243,.30)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(62,109,243,.38)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:0 4px 16px rgba(28,41,81,.06)}
.btn.ghost:hover{transform:translateY(-2px);border-color:var(--a1)}

/* Signature: a frame locked to an anchor point in space */
.anchor-scene{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);pointer-events:none;perspective:800px}
.frame3d{width:120px;height:86px;border:2px solid rgba(62,109,243,.55);border-radius:2px;background:linear-gradient(135deg,rgba(62,109,243,.12),rgba(90,165,247,.06));backdrop-filter:blur(2px);transform:rotateX(8deg) rotateY(-16deg);animation:hover 6s ease-in-out infinite}
.tether{width:1px;height:56px;margin:0 auto;background:linear-gradient(rgba(62,109,243,.45),transparent)}
.anchor-dot{width:10px;height:10px;margin:-4px auto 0;border-radius:50%;background:var(--a1);box-shadow:0 0 0 0 rgba(62,109,243,.45);animation:pulse 2.4s ease-out infinite}
@keyframes hover{0%,100%{transform:rotateX(8deg) rotateY(-16deg) translateY(0)}50%{transform:rotateX(8deg) rotateY(-16deg) translateY(-10px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,230,212,.5)}70%{box-shadow:0 0 0 18px rgba(55,230,212,0)}100%{box-shadow:0 0 0 0 rgba(55,230,212,0)}}
@media (prefers-reduced-motion:reduce){.frame3d,.anchor-dot{animation:none}}

/* ---------- In-AR UI ---------- */
.controls-panel{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:14px;background:rgba(12,16,28,.62);backdrop-filter:blur(18px);border-radius:999px;padding:13px 22px;border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 40px rgba(0,0,0,.45);z-index:1000}
.control-btn{width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.16);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;transition:.25s;color:#fff;background:rgba(255,255,255,.08);font-family:'Inter',sans-serif}
.control-btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.45)}
.add-btn{background:var(--grad);color:#fff;border:none}
.remove-btn.active{background:#E8484F;border-color:#E8484F;color:#fff}
.save-btn{font-size:15px}
.xr-active .landing{display:none}
.xr-active .controls-panel{display:flex}

/* PERF: the DOM overlay is composited into every XR frame — backdrop blur
   on Quest costs whole milliseconds and caused visible frame drops.
   In AR we swap blur for solid glass; the 2D page keeps its blur. */
.xr-active .controls-panel,
.xr-active .status-message{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(12,16,28,.9)}
.xr-active .modal{backdrop-filter:none;-webkit-backdrop-filter:none}

.file-input{display:none}
.status-message{position:fixed;top:28px;left:50%;transform:translateX(-50%);background:rgba(12,16,28,.85);color:#fff;padding:13px 26px;border-radius:999px;font-size:15px;font-weight:500;z-index:1001;backdrop-filter:blur(12px);display:none;max-width:82%;text-align:center;border:1px solid rgba(255,255,255,.14)}
.status-message.locked{border-color:rgba(90,165,247,.65)}

/* ---------- Live exhibit map (AR overlay) ---------- */
.map-panel{position:fixed;top:24px;right:24px;z-index:1000;display:none;width:280px;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% -10%,#FFFFFF 0%,var(--bg) 70%);border:1px solid var(--line);box-shadow:0 12px 40px rgba(16,24,44,.35)}
.map-head{font-size:12px;font-weight:800;letter-spacing:-.01em;color:var(--navy);padding:9px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.map-head b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.map-head span{color:var(--dim);font-weight:500;white-space:nowrap}
#map-canvas{display:block;width:280px;height:210px}
.xr-active .map-panel{display:block}

.modal{position:fixed;inset:0;background:rgba(16,24,44,.5);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(6px)}
.modal-content{background:#fff;border:1px solid var(--line);padding:36px;border-radius:18px;text-align:center;max-width:500px;margin:20px;box-shadow:0 24px 60px rgba(16,24,44,.25)}
.modal-title{font-weight:800;font-size:1.25rem;margin-bottom:14px;color:var(--navy);letter-spacing:-.01em}
.modal-text{font-size:1rem;margin-bottom:26px;color:var(--dim);line-height:1.6}
.modal-buttons{display:flex;gap:14px;justify-content:center}
.modal-btn{padding:13px 26px;border-radius:999px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.25s;font-family:'Inter',sans-serif}
.modal-btn-primary{background:var(--grad);color:#fff;border:none}
.modal-btn-secondary{background:#fff;color:var(--dim);border:1px solid var(--line)}
.modal-btn:hover{transform:translateY(-2px)}
@media (max-width:768px){.cta{flex-direction:column;align-items:stretch}.anchor-scene{display:none}.controls-panel{gap:10px;padding:11px 16px}.control-btn{width:50px;height:50px}.map-panel{top:16px;right:16px;width:220px}#map-canvas{width:220px;height:165px}}
</style>
</head>
<body>

<div class="landing" id="landing-page">
  <div class="floor"></div>
  <div class="glow"></div>
  <div class="hero">
    <h1 class="brand">NXT<span>/ExpoXR</span></h1>
    <p class="tag">Build boundless AR exhibitions with 3D models, photos and film, locked precisely to your space.</p>
    <div class="cta">
      <button class="btn primary" id="build-btn">Add First Piece</button>
      <button class="btn ghost" id="load-btn">Load Exhibit</button>
    </div>
  </div>
  <div class="anchor-scene">
    <div class="frame3d"></div>
    <div class="tether"></div>
    <div class="anchor-dot"></div>
  </div>
</div>

<div class="controls-panel" id="controls-panel">
  <button class="control-btn add-btn" id="add-btn" title="Add media">+</button>
  <button class="control-btn remove-btn" id="remove-btn" title="Remove">−</button>
  <button class="control-btn mute-btn" id="mute-btn" title="Toggle sound">🔇</button>
  <button class="control-btn save-btn" id="save-btn" title="Save exhibit">💾</button>
  <button class="control-btn close-btn" id="close-btn" title="Exit AR">×</button>
</div>

<div class="map-panel" id="map-panel">
  <div class="map-head"><span style="color:var(--navy)">NXT<b>/Map</b></span><span id="map-info"></span></div>
  <canvas id="map-canvas"></canvas>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 class="modal-title" id="modal-title"></h2>
    <p class="modal-text" id="modal-text"></p>
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-secondary" id="modal-cancel">Cancel</button>
      <button class="modal-btn modal-btn-primary" id="modal-confirm">Continue</button>
    </div>
  </div>
</div>

<div class="status-message" id="status-message"></div>

<input type="file" class="file-input" id="file-input" multiple
  accept=".obj,.glb,.gltf,.jpg,.jpeg,.png,.webp,.mp4,.webm">
<input type="file" class="file-input" id="zip-input" accept=".zip">

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'https://unpkg.com/three@0.150.1/examples/jsm/loaders/OBJLoader.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.150.1/examples/jsm/loaders/GLTFLoader.js';

/* ============================================================
   NXT/ExpoXR v3.1
   Anchor architecture unchanged: exhibitRoot welded to a
   persistent WebXR anchor, all item transforms anchor-relative.

   v3.1 — flicker & frame-drop fixes + live map:
   · Z-FIGHT KILL: media face now sits 4 mm proud of a slimmer
     frame, and camera near/far tightened 0.05→40 m. The old
     1.5 mm gap inside a 0.01→60 range shimmered while moving.
   · DOM overlay backdrop-blur disabled in AR (composited every
     XR frame on Quest = dropped frames), solid glass instead.
   · Framebuffer 1.5→1.2 + fixed foveation: same perceived
     sharpness at exhibit distances, big GPU headroom for video.
   · Frames on photos/video 75 % slimmer (border 12.5 mm, 7 mm deep).
   · Live metric mini-map in the overlay: landing-page grid,
     pieces to scale, orientations, nearest-neighbour distances,
     anchor pulse, and your position + heading. Redraws at 4 Hz.
   ============================================================ */

const EXT = {
  model: ['obj','glb','gltf'],
  image: ['jpg','jpeg','png','webp'],
  video: ['mp4','webm']
};
const MIME = { mp4:'video/mp4', webm:'video/webm', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp' };

const LAYOUT = {
  radius: 2.0, arcStep: Math.PI/5,
  flatHeight: 1.4, modelHeight: 0.0,
  flatSize: 1.0, modelSize: 0.6,
  frameBorder: 0.0125, frameDepth: 0.007   // 75 % slimmer than v3
};

let camera, scene, renderer, exhibitRoot;
let controllers = [];
let items = [];
const fileStore = new Map();
let xrSession = null, referenceSpace = null;
let interactionMode = 'none', selectedItem = null, removeMode = false;
let activeControllers = new Set();
let initialControllerPositions = {}, initialDistance = 0;
let initialScale = new THREE.Vector3(), initialRotation = 0, baseRotY = 0;
let placeIndex = 0, muted = true, pendingAction = null, isFirstPiece = true;

// Anchor state
let anchor = null;            // live XRAnchor this session
let anchorUUID = null;        // persistent handle (device-local)
let wantRestoreUUID = null;   // uuid read from a loaded exhibit
let pendingAnchorSave = null; // resolver waiting on an XRFrame

const $ = id => document.getElementById(id);

init();

/* ---------------- Setup ---------------- */
function init() {
  scene = new THREE.Scene();
  // Tight near/far = far better depth precision on Quest's depth buffer.
  // 0.01→60 was a z-fighting invitation; 0.05→40 covers any room exhibit.
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 40);
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.xr.enabled = true;
  // 1.2x + foveation is the Quest 3 sweet spot: photos stay crisp at
  // gallery distance and the GPU keeps ~40% headroom for video decode.
  renderer.xr.setFramebufferScaleFactor(1.2);
  renderer.xr.setFoveation(1.0);
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);

  // Everything hangs off this root; its matrix is driven by the anchor.
  exhibitRoot = new THREE.Group();
  exhibitRoot.matrixAutoUpdate = false;
  scene.add(exhibitRoot);

  setupLights();

  $('build-btn').onclick = () => items.length ? startAR() : $('file-input').click();
  $('load-btn').onclick  = () => $('zip-input').click();
  $('add-btn').onclick   = () => $('file-input').click();
  $('remove-btn').onclick = toggleRemoveMode;
  $('mute-btn').onclick  = toggleMute;
  $('save-btn').onclick  = promptSave;
  $('close-btn').onclick = () => xrSession && xrSession.end();
  $('file-input').onchange = onFilesSelected;
  $('zip-input').onchange  = onZipSelected;
  $('modal-cancel').onclick = hideModal;
  $('modal-confirm').onclick = () => { hideModal(true); };
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

function setupLights() {
  scene.add(new THREE.AmbientLight(0xffffff, 1.1));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.6));
  const dir = new THREE.DirectionalLight(0xffffff, 1.5);
  dir.position.set(1, 2, 1);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.5);
  dir2.position.set(-1, 1, -1);
  scene.add(dir2);
}

// World -> exhibit-local (root may be posed by the anchor)
const toLocal = v => exhibitRoot.worldToLocal(v.clone());

/* ---------------- UI helpers ---------------- */
function showStatus(msg, isError = false, locked = false) {
  const el = $('status-message');
  el.textContent = msg;
  el.style.display = 'block';
  el.classList.toggle('locked', locked);
  el.style.background = isError ? 'rgba(212,58,74,.9)' : '';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = 'none', 3500);
}

function showModal(title, text, action) {
  $('modal-title').textContent = title;
  $('modal-text').textContent = text;
  $('modal').style.display = 'flex';
  pendingAction = action;
}
function hideModal(confirmed = false) {
  $('modal').style.display = 'none';
  const a = pendingAction; pendingAction = null;
  if (confirmed && a) a();
}

function updateLandingButton() {
  $('build-btn').textContent = items.length ? `Launch AR (${items.length} pieces)` : 'Add First Piece';
}

function kindOf(filename) {
  const ext = filename.toLowerCase().split('.').pop();
  for (const k in EXT) if (EXT[k].includes(ext)) return { kind: k, ext };
  return { kind: null, ext };
}

function uniqueName(name) {
  if (!fileStore.has(name)) return name;
  const dot = name.lastIndexOf('.');
  const base = name.slice(0, dot), ext = name.slice(dot);
  let n = 2;
  while (fileStore.has(`${base}_${n}${ext}`)) n++;
  return `${base}_${n}${ext}`;
}

/* ---------------- Adding media ---------------- */
async function onFilesSelected(e) {
  const files = [...e.target.files];
  e.target.value = '';
  for (const file of files) {
    const { kind } = kindOf(file.name);
    if (!kind) { showStatus(`Unsupported: ${file.name}`, true); continue; }
    const name = uniqueName(file.name);
    fileStore.set(name, file);
    showStatus(`Loading ${name}…`);
    try {
      await addItem(file, name, kind, null);
      showStatus(`${name} added (${items.length} pieces).`);
    } catch (err) {
      console.error(err);
      fileStore.delete(name);
      showStatus(`Failed to load ${name}`, true);
    }
  }
  updateLandingButton();
  if (items.length && isFirstPiece && !xrSession) {
    isFirstPiece = false;
    setTimeout(startAR, 800);
  }
}

function addItem(blob, filename, kind, saved) {
  if (kind === 'model') return addModel(blob, filename, saved);
  if (kind === 'image') return addImage(blob, filename, saved);
  if (kind === 'video') return addVideo(blob, filename, saved);
  return Promise.reject(new Error('unknown kind'));
}

function addModel(blob, filename, saved) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const done = obj => { URL.revokeObjectURL(url); finalizeItem(normalizeModel(obj), filename, 'model', saved); resolve(); };
    const fail = err => { URL.revokeObjectURL(url); reject(err); };
    const { ext } = kindOf(filename);
    if (ext === 'obj') new OBJLoader().load(url, done, undefined, fail);
    else new GLTFLoader().load(url, g => done(g.scene), undefined, fail);
  });
}

function normalizeModel(obj) {
  obj.traverse(c => {
    if (c.isMesh) {
      if (!c.material) c.material = new THREE.MeshStandardMaterial({ color:0x888888, roughness:.5, metalness:.3 });
      c.castShadow = c.receiveShadow = true;
    }
  });
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const s = LAYOUT.modelSize / Math.max(size.x, size.y, size.z, 1e-6);
  const wrapper = new THREE.Group();
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);
  obj.position.y += size.y / 2;
  wrapper.add(obj);
  wrapper.scale.setScalar(s);
  return wrapper;
}

function addImage(blob, filename, saved) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    new THREE.TextureLoader().load(url, tex => {
      URL.revokeObjectURL(url);
      tex.encoding = THREE.sRGBEncoding;
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const group = makeFlatPiece(tex.image.width / tex.image.height, tex);
      finalizeItem(group, filename, 'image', saved);
      resolve();
    }, undefined, err => { URL.revokeObjectURL(url); reject(err); });
  });
}

function addVideo(blob, filename, saved) {
  return new Promise((resolve, reject) => {
    const { ext } = kindOf(filename);
    const typed = blob.type ? blob : new Blob([blob], { type: MIME[ext] || 'video/mp4' });
    const video = document.createElement('video');
    video.loop = true; video.muted = muted; video.playsInline = true;
    video.setAttribute('playsinline', ''); video.setAttribute('muted', '');
    video.crossOrigin = 'anonymous'; video.preload = 'auto';
    video.src = URL.createObjectURL(typed);
    video.onloadedmetadata = () => {
      const tex = new THREE.VideoTexture(video);
      tex.encoding = THREE.sRGBEncoding;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      const group = makeFlatPiece(video.videoWidth / video.videoHeight || 16/9, tex);
      group.userData.video = video;
      video.play().catch(() => {});
      finalizeItem(group, filename, 'video', saved);
      resolve();
    };
    video.onerror = () => reject(new Error('video decode failed'));
  });
}

function makeFlatPiece(aspect, texture) {
  const w = aspect >= 1 ? LAYOUT.flatSize : LAYOUT.flatSize * aspect;
  const h = aspect >= 1 ? LAYOUT.flatSize / aspect : LAYOUT.flatSize;
  const B = LAYOUT.frameBorder, D = LAYOUT.frameDepth;
  const group = new THREE.Group();
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(w + B, h + B, D),
    new THREE.MeshStandardMaterial({ color:0x141414, roughness:.6, metalness:.25 })
  );
  const face = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, toneMapped: false })
  );
  // 4 mm proud of the frame front — comfortably outside depth-buffer
  // noise at room distances. The old 1.5 mm gap was the flicker.
  face.position.z = D / 2 + 0.004;
  group.add(frame, face);
  return group;
}

function finalizeItem(obj, filename, kind, saved) {
  obj.userData.isPiece = true;
  obj.userData.filename = filename;
  obj.userData.kind = kind;

  if (saved) {
    // Saved transforms are anchor-relative: restore verbatim.
    obj.position.set(saved.position.x, saved.position.y, saved.position.z);
    obj.rotation.set(saved.rotation.x, saved.rotation.y, saved.rotation.z);
    obj.scale.set(saved.scale.x, saved.scale.y, saved.scale.z);
  } else {
    autoPlace(obj, kind);
  }
  exhibitRoot.add(obj);
  items.push(obj);
}

function autoPlace(obj, kind) {
  if (renderer.xr.isPresenting) {
    // Drop new pieces 1.5 m in front of the visitor's face.
    const cam = renderer.xr.getCamera();
    const p = new THREE.Vector3(), d = new THREE.Vector3();
    cam.getWorldPosition(p); cam.getWorldDirection(d);
    d.y = 0; d.normalize();
    p.add(d.multiplyScalar(1.5));
    const lp = toLocal(p);
    lp.y = kind === 'model' ? LAYOUT.modelHeight : LAYOUT.flatHeight;
    obj.position.copy(lp);
    if (kind !== 'model') {
      const lc = toLocal(new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld));
      obj.lookAt(lc.x, lp.y, lc.z);
    }
    placeIndex++;
    return;
  }
  // Pre-AR: curved gallery wall centred on the anchor origin.
  const i = placeIndex++;
  const perRow = 5;
  const row = Math.floor(i / perRow), col = i % perRow;
  const angle = (col - (perRow - 1) / 2) * LAYOUT.arcStep;
  const r = LAYOUT.radius + row * 1.2;
  const y = kind === 'model' ? LAYOUT.modelHeight : LAYOUT.flatHeight;
  obj.position.set(Math.sin(angle) * r, y, -Math.cos(angle) * r);
  if (kind !== 'model') obj.lookAt(0, y, 0);
}

/* ---------------- Remove / clear ---------------- */
function removeItem(obj) {
  const i = items.indexOf(obj);
  if (i === -1) return;
  items.splice(i, 1);
  fileStore.delete(obj.userData.filename);
  disposeItem(obj);
  updateLandingButton();
  showStatus('Piece removed.');
}

function disposeItem(obj) {
  exhibitRoot.remove(obj);
  if (obj.userData.video) {
    obj.userData.video.pause();
    URL.revokeObjectURL(obj.userData.video.src);
    obj.userData.video.src = '';
  }
  obj.traverse(c => {
    if (c.geometry) c.geometry.dispose();
    const mats = Array.isArray(c.material) ? c.material : c.material ? [c.material] : [];
    mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
  });
}

function clearAll() {
  [...items].forEach(disposeItem);
  items = [];
  fileStore.clear();
  placeIndex = 0;
  anchor = null; anchorUUID = null; wantRestoreUUID = null;
  exhibitRoot.matrix.identity();
  exhibitRoot.updateMatrixWorld(true);
}

/* ---------------- Persistent anchors ---------------- */
// Anchor creation needs an XRFrame; the render loop resolves this.
function createExhibitAnchor() {
  return new Promise(res => { pendingAnchorSave = res; });
}

async function ensureAnchor() {
  if (anchor && anchorUUID) return anchorUUID;   // already welded this session
  if (!xrSession) return null;
  return await createExhibitAnchor();
}

async function tryRestoreAnchor(session) {
  const uuid = anchorUUID || wantRestoreUUID;
  if (!uuid || !session.restorePersistentAnchor) return;
  try {
    anchor = await session.restorePersistentAnchor(uuid);
    anchorUUID = uuid; wantRestoreUUID = null;
    showStatus('Room anchor restored. Every piece is locked in place.', false, true);
  } catch {
    anchor = null;
    showStatus('Anchor not found on this headset. Using your standing spot instead.');
  }
}

/* ---------------- Save / load exhibit ---------------- */
function promptSave() {
  if (!items.length) { showStatus('Nothing to save!', true); return; }
  showModal(
    'Save Exhibit',
    'The exhibit is welded to a persistent room anchor: reload on THIS headset and every piece snaps back exactly, wherever you stand. For a different headset, also mark your standing spot and facing direction (tape works) and start AR from there.',
    saveExhibit
  );
}

async function saveExhibit() {
  try {
    showStatus('Locking room anchor…');
    const uuid = await ensureAnchor();
    showStatus('Packing exhibit…');
    const zip = new JSZip();
    const data = {
      version: '3.1',
      created: new Date().toISOString(),
      anchorUUID: uuid,
      items: items.map(o => ({
        filename: o.userData.filename,
        kind: o.userData.kind,
        position: { x:o.position.x, y:o.position.y, z:o.position.z },
        rotation: { x:o.rotation.x, y:o.rotation.y, z:o.rotation.z },
        scale:    { x:o.scale.x,    y:o.scale.y,    z:o.scale.z }
      }))
    };
    for (const o of items) {
      const f = fileStore.get(o.userData.filename);
      if (f) zip.file(`media/${o.userData.filename}`, f);
      else console.warn('Missing file data:', o.userData.filename);
    }
    zip.file('exhibit.json', JSON.stringify(data, null, 2));
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `NXT-ExpoXR_${new Date().toISOString().slice(0,10)}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    showStatus(uuid
      ? `Saved. ${items.length} pieces, anchor-locked.`
      : `Saved. ${items.length} pieces (no anchor support, standing-spot mode).`, false, !!uuid);
  } catch (err) {
    console.error(err);
    showStatus('Save failed.', true);
  }
}

function onZipSelected(e) {
  if (!e.target.files.length) return;
  const file = e.target.files[0];
  e.target.value = '';
  showModal(
    'Load Exhibit',
    'If this exhibit was saved on this headset, the room anchor restores every piece exactly and you can stand anywhere. Otherwise, stand on the marked spot facing the marked direction before continuing.',
    () => loadExhibit(file)
  );
}

async function loadExhibit(file) {
  try {
    showStatus('Unpacking exhibit…');
    clearAll();
    const zip = await JSZip.loadAsync(file);
    const cfg = zip.file('exhibit.json');
    if (!cfg) throw new Error('exhibit.json missing');
    const data = JSON.parse(await cfg.async('text'));
    wantRestoreUUID = data.anchorUUID || null;

    // v3/v2 use items[] + media/, v1 used models[] + models/
    const list = data.items || (data.models || []).map(m => ({ ...m, kind: kindOf(m.filename).kind || 'model' }));
    const dir = data.items ? 'media' : 'models';
    showStatus(`Loading ${list.length} pieces…`);

    let ok = 0;
    for (const entry of list) {
      const zf = zip.file(`${dir}/${entry.filename}`);
      if (!zf) { console.warn('Missing in zip:', entry.filename); continue; }
      const blob = await zf.async('blob');
      fileStore.set(entry.filename, blob);
      try { await addItem(blob, entry.filename, entry.kind, entry); ok++; }
      catch (err) { console.error(entry.filename, err); fileStore.delete(entry.filename); }
    }
    placeIndex = items.length;
    updateLandingButton();
    if (!ok) throw new Error('no pieces loaded');
    showStatus(`Exhibit restored: ${ok} pieces.`);
    setTimeout(startAR, 800);
  } catch (err) {
    console.error(err);
    showStatus('Could not load exhibit. Check the file.', true);
  }
}

/* ---------------- XR session ---------------- */
function startAR() {
  if (!navigator.xr) { showStatus('WebXR not supported in this browser.', true); return; }
  navigator.xr.isSessionSupported('immersive-ar').then(supported => {
    if (!supported) { showStatus('Immersive AR not supported on this device.', true); return; }
    navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['anchors', 'dom-overlay', 'hand-tracking'],
      domOverlay: { root: document.body }
    }).then(onSessionStarted).catch(err => {
      console.error(err);
      showStatus('Could not start AR session.', true);
    });
  });
}

async function onSessionStarted(session) {
  xrSession = session;
  document.body.classList.add('xr-active');

  // local-floor ONLY: a single, deterministic space. The anchor does
  // the re-localisation; mixing unbounded/local across save & load
  // was a drift source.
  for (const type of ['local-floor', 'local']) {
    try { referenceSpace = await session.requestReferenceSpace(type); break; }
    catch { /* try next */ }
  }
  renderer.xr.setReferenceSpace(referenceSpace);
  renderer.xr.setSession(session);
  setupControllers();
  renderer.setAnimationLoop(render);
  session.addEventListener('end', onSessionEnd);

  await tryRestoreAnchor(session);

  items.forEach(o => o.userData.video && o.userData.video.play().catch(() => {}));
  showStatus('AR active. Grab pieces with the trigger; two hands to scale & rotate.');
}

function onSessionEnd() {
  document.body.classList.remove('xr-active');
  controllers.forEach(c => scene.remove(c));
  controllers = [];
  activeControllers.clear();
  selectedItem = null;
  removeMode = false;
  $('remove-btn').classList.remove('active');
  interactionMode = 'none';
  referenceSpace = null;
  anchor = null; // XRAnchor dies with the session; anchorUUID survives for restore
  renderer.setAnimationLoop(null);
  xrSession = null;
  items.forEach(o => o.userData.video && o.userData.video.pause());
}

/* ---------------- Controllers & interaction ----------------
   All manipulation happens in exhibitRoot-local space, so item
   transforms stay anchor-relative and save/load is exact.      */
function setupControllers() {
  for (let i = 0; i < 2; i++) {
    const c = renderer.xr.getController(i);
    c.userData.id = i;
    c.addEventListener('selectstart', onSelectStart);
    c.addEventListener('selectend', onSelectEnd);
    scene.add(c);
    controllers.push(c);
  }
}

function grabRadius(obj) {
  const sphere = new THREE.Box3().setFromObject(obj).getBoundingSphere(new THREE.Sphere());
  return Math.max(0.5, sphere.radius * 1.15);
}

function findNearest(pos) {
  let best = null, bestScore = 1;
  for (const o of items) {
    const p = new THREE.Vector3();
    o.getWorldPosition(p);
    const score = pos.distanceTo(p) / grabRadius(o);
    if (score < bestScore) { bestScore = score; best = o; }
  }
  return best;
}

function onSelectStart(e) {
  const controller = e.target;
  const pos = new THREE.Vector3();
  controller.getWorldPosition(pos);
  activeControllers.add(controller.userData.id);

  if (removeMode) {
    const hit = findNearest(pos);
    if (hit) removeItem(hit);
    return;
  }

  if (interactionMode === 'none') {
    const hit = findNearest(pos);
    if (hit) {
      selectedItem = hit;
      interactionMode = 'move';
      highlight(hit, true);
      hit.userData.grabOffset = new THREE.Vector3().subVectors(hit.position, toLocal(pos));
      showStatus('Moving. Add second hand to scale & rotate.');
    }
  } else if (interactionMode === 'move' && activeControllers.size === 2) {
    interactionMode = 'transform';
    controllers.forEach(c => {
      const p = new THREE.Vector3();
      c.getWorldPosition(p);
      initialControllerPositions[c.userData.id] = toLocal(p);
    });
    initialDistance = initialControllerPositions[0].distanceTo(initialControllerPositions[1]);
    initialScale.copy(selectedItem.scale);
    baseRotY = selectedItem.rotation.y;
    const v = new THREE.Vector3().subVectors(initialControllerPositions[1], initialControllerPositions[0]);
    initialRotation = Math.atan2(v.x, v.z);
    showStatus('Scale & rotate!');
  }
}

function onSelectEnd(e) {
  activeControllers.delete(e.target.userData.id);
  if (!selectedItem) return;

  if (interactionMode === 'transform' && activeControllers.size === 1) {
    interactionMode = 'move';
    const c = controllers[[...activeControllers][0]];
    const pos = new THREE.Vector3();
    c.getWorldPosition(pos);
    selectedItem.userData.grabOffset = new THREE.Vector3().subVectors(selectedItem.position, toLocal(pos));
  } else if (activeControllers.size === 0) {
    highlight(selectedItem, false);
    selectedItem.userData.grabOffset = null;
    selectedItem = null;
    interactionMode = 'none';
    initialControllerPositions = {};
    if (!removeMode) showStatus('Piece anchored.');
  }
}

function handleInteraction() {
  if (!selectedItem) return;

  if (interactionMode === 'move' && activeControllers.size === 1) {
    const c = controllers[[...activeControllers][0]];
    const pos = new THREE.Vector3();
    c.getWorldPosition(pos);
    if (selectedItem.userData.grabOffset)
      selectedItem.position.copy(toLocal(pos)).add(selectedItem.userData.grabOffset);

  } else if (interactionMode === 'transform' && activeControllers.size === 2) {
    const a = new THREE.Vector3(), b = new THREE.Vector3();
    controllers[0].getWorldPosition(a);
    controllers[1].getWorldPosition(b);
    const la = toLocal(a), lb = toLocal(b);

    if (initialDistance > 0) {
      const f = THREE.MathUtils.clamp(la.distanceTo(lb) / initialDistance, 0.05, 20);
      selectedItem.scale.copy(initialScale).multiplyScalar(f);
    }
    const v = new THREE.Vector3().subVectors(lb, la);
    selectedItem.rotation.y = baseRotY + (Math.atan2(v.x, v.z) - initialRotation);
    selectedItem.position.copy(la).add(lb).multiplyScalar(0.5);
  }
}

/* ---------------- Highlight / modes ---------------- */
function highlight(obj, on) {
  if (!obj) return;
  const color = removeMode ? 0xff2222 : 0x2288ff;
  obj.traverse(c => {
    if (!c.isMesh || !c.material) return;
    const m = c.material;
    if (m.emissive) {
      if (on) {
        m._origEmissive ??= m.emissive.clone();
        m.emissive.setHex(color);
        m.emissiveIntensity = 0.45;
      } else if (m._origEmissive) {
        m.emissive.copy(m._origEmissive);
        m.emissiveIntensity = 0;
      }
    } else if (m.color) {
      if (on) {
        m._origColor ??= m.color.clone();
        m.color.setHex(removeMode ? 0xff9999 : 0x99ccff);
      } else if (m._origColor) {
        m.color.copy(m._origColor);
      }
    }
  });
}

function toggleRemoveMode() {
  removeMode = !removeMode;
  $('remove-btn').classList.toggle('active', removeMode);
  items.forEach(o => highlight(o, removeMode));
  showStatus(removeMode ? 'Remove mode: squeeze trigger near a piece to delete.' : 'Remove mode off.');
}

function toggleMute() {
  muted = !muted;
  $('mute-btn').textContent = muted ? '🔇' : '🔊';
  items.forEach(o => {
    const v = o.userData.video;
    if (v) { v.muted = muted; v.play().catch(() => {}); }
  });
  showStatus(muted ? 'Videos muted.' : 'Sound on.');
}

/* ---------------- Live exhibit map ----------------
   Top-down, metric, drawn on the landing-page grid so the 2D
   overlay speaks the same design language. Throttled to 4 Hz —
   the XR render loop never waits on the DOM.                  */
const mapCv = $('map-canvas'), mapCtx = mapCv.getContext('2d');
const MDPR = 2;
let lastMap = 0;
const NAVY = '#1C2951', A1 = '#3E6DF3', A2 = '#5AA5F7', DIM = '#5A6478';

function fitMapCanvas() {
  const r = mapCv.getBoundingClientRect();
  mapCv.width  = Math.max(1, Math.round(r.width  * MDPR));
  mapCv.height = Math.max(1, Math.round(r.height * MDPR));
}

function itemRadius(o) {
  // Bounding-sphere radius, cached & invalidated on scale change.
  if (o.userData.mapR == null || o.userData.mapS !== o.scale.x) {
    const s = new THREE.Box3().setFromObject(o).getBoundingSphere(new THREE.Sphere());
    o.userData.mapR = Math.max(0.1, s.radius);
    o.userData.mapS = o.scale.x;
  }
  return o.userData.mapR;
}

function drawMap() {
  if (!mapCv.width) fitMapCanvas();
  const ctx = mapCtx, W = mapCv.width, H = mapCv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // Everything in exhibit-local space: anchor origin = (0,0), like reality.
  const pts = items.map(o => ({ o, x:o.position.x, z:o.position.z, r:itemRadius(o) }));

  let vx = 0, vz = 0, hx = 0, hz = 1, hasV = false;
  if (renderer.xr.isPresenting) {
    const cam = renderer.xr.getCamera();
    const p = toLocal(new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld));
    const d = new THREE.Vector3();
    cam.getWorldDirection(d);
    d.applyQuaternion(exhibitRoot.getWorldQuaternion(new THREE.Quaternion()).invert());
    vx = p.x; vz = p.z; hx = d.x; hz = d.z; hasV = true;
  }

  // Bounds: anchor + all pieces + viewer, min 3 m span.
  let minX = -0.4, maxX = 0.4, minZ = -0.4, maxZ = 0.4;
  if (hasV) { minX = Math.min(minX, vx - .4); maxX = Math.max(maxX, vx + .4); minZ = Math.min(minZ, vz - .4); maxZ = Math.max(maxZ, vz + .4); }
  for (const p of pts) {
    minX = Math.min(minX, p.x - p.r); maxX = Math.max(maxX, p.x + p.r);
    minZ = Math.min(minZ, p.z - p.r); maxZ = Math.max(maxZ, p.z + p.r);
  }
  const spanX = Math.max(3, maxX - minX), spanZ = Math.max(3, maxZ - minZ);
  const pad = 22 * MDPR;
  const s = Math.min((W - pad * 2) / spanX, (H - pad * 2) / spanZ);
  const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
  const X = x => W / 2 + (x - cx) * s;
  const Z = z => H / 2 + (z - cz) * s;

  // Metric grid, same rhythm as the landing floor. Fine grid when zoomed.
  const g = s > 95 * MDPR ? 0.5 : 1;
  ctx.strokeStyle = 'rgba(28,41,81,.10)';
  ctx.lineWidth = 1 * MDPR;
  for (let x = Math.floor((cx - W / (2 * s)) / g) * g; X(x) < W; x += g) {
    ctx.beginPath(); ctx.moveTo(X(x), 0); ctx.lineTo(X(x), H); ctx.stroke();
  }
  for (let z = Math.floor((cz - H / (2 * s)) / g) * g; Z(z) < H; z += g) {
    ctx.beginPath(); ctx.moveTo(0, Z(z)); ctx.lineTo(W, Z(z)); ctx.stroke();
  }

  // Anchor origin: the pulsing dot from the landing page, now for real.
  ctx.beginPath(); ctx.arc(X(0), Z(0), 6 * MDPR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(62,109,243,.35)'; ctx.lineWidth = 2 * MDPR; ctx.stroke();
  ctx.beginPath(); ctx.arc(X(0), Z(0), 3 * MDPR, 0, Math.PI * 2);
  ctx.fillStyle = A1; ctx.fill();

  // Nearest-neighbour distance lines between pieces.
  ctx.font = `500 ${9 * MDPR}px Inter, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const done = new Set();
  for (let i = 0; i < pts.length; i++) {
    let bj = -1, bd = Infinity;
    for (let j = 0; j < pts.length; j++) {
      if (i === j) continue;
      const d = Math.hypot(pts[i].x - pts[j].x, pts[i].z - pts[j].z);
      if (d < bd) { bd = d; bj = j; }
    }
    if (bj < 0) continue;
    const key = Math.min(i, bj) + '-' + Math.max(i, bj);
    if (done.has(key)) continue;
    done.add(key);
    const x1 = X(pts[i].x), y1 = Z(pts[i].z), x2 = X(pts[bj].x), y2 = Z(pts[bj].z);
    ctx.setLineDash([3 * MDPR, 4 * MDPR]);
    ctx.strokeStyle = 'rgba(90,100,120,.5)'; ctx.lineWidth = 1 * MDPR;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.setLineDash([]);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, label = bd.toFixed(2) + ' m';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.fillRect(mx - tw / 2 - 3 * MDPR, my - 6.5 * MDPR, tw + 6 * MDPR, 13 * MDPR);
    ctx.fillStyle = DIM; ctx.fillText(label, mx, my);
  }

  // Pieces, to scale. Flats drawn as oriented wall segments, models as discs.
  for (const p of pts) {
    const sel = p.o === selectedItem;
    const px = X(p.x), pz = Z(p.z), pr = Math.max(3 * MDPR, p.r * s);
    if (p.o.userData.kind === 'model') {
      ctx.beginPath(); ctx.arc(px, pz, pr, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(28,41,81,.18)'; ctx.fill();
      ctx.strokeStyle = NAVY; ctx.lineWidth = 1.5 * MDPR; ctx.stroke();
    } else {
      const ry = p.o.rotation.y;                    // width axis after rotY
      const dx = Math.cos(ry), dz = -Math.sin(ry);  // local X → screen
      ctx.beginPath();
      ctx.moveTo(px - dx * pr, pz - dz * pr);
      ctx.lineTo(px + dx * pr, pz + dz * pr);
      ctx.strokeStyle = p.o.userData.kind === 'video' ? A2 : A1;
      ctx.lineWidth = 3.5 * MDPR; ctx.lineCap = 'round'; ctx.stroke();
    }
    if (sel) {
      ctx.beginPath(); ctx.arc(px, pz, pr + 5 * MDPR, 0, Math.PI * 2);
      ctx.strokeStyle = A2; ctx.lineWidth = 2 * MDPR;
      ctx.setLineDash([4 * MDPR, 4 * MDPR]); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // The visitor: heading arrow, plus distance to the nearest piece.
  if (hasV) {
    let near = null, nd = Infinity;
    for (const p of pts) {
      const d = Math.hypot(p.x - vx, p.z - vz);
      if (d < nd) { nd = d; near = p; }
    }
    if (near) {
      ctx.setLineDash([2 * MDPR, 5 * MDPR]);
      ctx.strokeStyle = 'rgba(62,109,243,.55)'; ctx.lineWidth = 1 * MDPR;
      ctx.beginPath(); ctx.moveTo(X(vx), Z(vz)); ctx.lineTo(X(near.x), Z(near.z)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = A1;
      ctx.fillText(nd.toFixed(2) + ' m', (X(vx) + X(near.x)) / 2, (Z(vz) + Z(near.z)) / 2 - 8 * MDPR);
    }
    const a = Math.atan2(hz, hx);
    ctx.save();
    ctx.translate(X(vx), Z(vz));
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(7 * MDPR, 0); ctx.lineTo(-5 * MDPR, 4.5 * MDPR); ctx.lineTo(-5 * MDPR, -4.5 * MDPR);
    ctx.closePath();
    ctx.fillStyle = NAVY; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 * MDPR; ctx.stroke();
    ctx.restore();
  }

  $('map-info').textContent = `${items.length} piece${items.length === 1 ? '' : 's'} · grid ${g} m`;
}

/* ---------------- Render loop ---------------- */
function render(time, frame) {
  // 1) Weld exhibitRoot to the anchor's re-localised pose every frame.
  if (frame && anchor && referenceSpace) {
    const pose = frame.getPose(anchor.anchorSpace, referenceSpace);
    if (pose) {
      exhibitRoot.matrix.fromArray(pose.transform.matrix);
      exhibitRoot.updateMatrixWorld(true);
    }
  }

  // 2) A save is waiting for an XRFrame to mint a persistent anchor.
  if (frame && pendingAnchorSave && referenceSpace) {
    const done = pendingAnchorSave; pendingAnchorSave = null;
    if (frame.createAnchor) {
      frame.createAnchor(new XRRigidTransform(), referenceSpace).then(async a => {
        if (anchorUUID && xrSession?.deletePersistentAnchor) {
          try { await xrSession.deletePersistentAnchor(anchorUUID); } catch {}
        }
        anchor = a;
        anchorUUID = a.requestPersistentHandle ? await a.requestPersistentHandle() : null;
        done(anchorUUID);
      }).catch(() => done(null));
    } else done(null);
  }

  if (selectedItem && interactionMode !== 'none') handleInteraction();

  // 3) Mini-map at 4 Hz — DOM work stays off the hot path.
  if (time - lastMap > 250) { lastMap = time; drawMap(); }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
